<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cambio Plata · ARS / UYU / USD</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&family=Figtree:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --rio:#0F2B35;        /* agua del Río de la Plata */
  --rio-2:#163C48;
  --limo:#1E4E5C;
  --plata:#C9D3D6;
  --plata-dim:#8FA3A9;
  --sol:#F2B544;        /* sol de mayo / sol uruguayo */
  --ok:#7FD1A8;
  --bad:#F28B7A;
  --bg:var(--rio);
  --surface:var(--rio-2);
  --line:rgba(201,211,214,.14);
  --text:#EEF3F4;
  --muted:var(--plata-dim);
  --display:"Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --body:"Figtree", "Segoe UI", system-ui, -apple-system, sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: light){
  :root:not([data-theme="dark"]){
    --bg:#E9EFF0; --surface:#FFFFFF; --line:rgba(15,43,53,.12);
    --text:#0F2B35; --muted:#5B7279; --sol:#B97A06; --ok:#1F8A5B; --bad:#C2412D; --limo:#D6E3E6;
  }
}
:root[data-theme="light"]{
  --bg:#E9EFF0; --surface:#FFFFFF; --line:rgba(15,43,53,.12);
  --text:#0F2B35; --muted:#5B7279; --sol:#B97A06; --ok:#1F8A5B; --bad:#C2412D; --limo:#D6E3E6;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{
  margin:0; background:var(--bg); color:var(--text); font-family:var(--body);
  font-size:16px; line-height:1.5; -webkit-font-smoothing:antialiased;
  background-image:
    radial-gradient(1200px 500px at 85% -10%, color-mix(in srgb, var(--sol) 12%, transparent), transparent 60%),
    repeating-linear-gradient(170deg, transparent 0 22px, color-mix(in srgb, var(--plata) 3%, transparent) 22px 23px);
  min-height:100vh;
}
.wrap{max-width:1080px; margin:0 auto; padding:24px 20px 64px}
header{display:flex; align-items:center; justify-content:space-between; gap:16px; flex-wrap:wrap; margin-bottom:28px}
.brand{display:flex; align-items:baseline; gap:12px}
.brand h1{font-family:var(--display); font-weight:800; font-size:1.6rem; letter-spacing:-.02em; margin:0}
.brand span{color:var(--muted); font-size:.95rem}
.live{display:flex; align-items:center; gap:10px; font-size:.9rem; color:var(--muted)}
.dot{width:9px; height:9px; border-radius:50%; background:var(--ok); box-shadow:0 0 0 0 var(--ok); animation:pulse 2.4s infinite}
.dot.err{background:var(--bad); animation:none}
.dot.load{background:var(--sol)}
@keyframes pulse{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--ok) 60%,transparent)}70%{box-shadow:0 0 0 9px transparent}100%{box-shadow:0 0 0 0 transparent}}
button{font:inherit; color:inherit; cursor:pointer}
.ghost{background:transparent; border:1px solid var(--line); border-radius:999px; padding:6px 14px; color:var(--text)}
.ghost:hover{border-color:var(--plata-dim)}
:focus-visible{outline:2px solid var(--sol); outline-offset:2px}

/* ---------- Conversor ---------- */
.converter{display:grid; grid-template-columns:1.1fr 1fr; gap:0; border:1px solid var(--line); border-radius:28px; overflow:hidden; background:var(--surface)}
.side-in{padding:32px; border-right:1px solid var(--line)}
.side-out{padding:32px; background:color-mix(in srgb, var(--limo) 45%, var(--surface))}
.q{color:var(--muted); font-size:.95rem; margin:0 0 10px}
.chips{display:flex; gap:8px; flex-wrap:wrap; margin-bottom:18px}
.chip{border:1px solid var(--line); background:transparent; border-radius:14px; padding:10px 14px; display:flex; gap:8px; align-items:center; font-weight:600}
.chip small{font-weight:400; color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--sol); color:#1b1405; border-color:var(--sol)}
.chip[aria-pressed="true"] small{color:#3d2e08}
.amount{display:flex; align-items:baseline; gap:10px; border-bottom:2px solid var(--line); padding-bottom:6px}
.amount:focus-within{border-color:var(--sol)}
.amount .sym{font-family:var(--display); font-size:2rem; color:var(--muted)}
.amount input{
  flex:1; min-width:0; background:transparent; border:0; outline:none; color:var(--text);
  font-family:var(--display); font-weight:800; font-size:clamp(2.6rem, 7vw, 4.6rem); letter-spacing:-.035em; line-height:1.05;
  font-variant-numeric:tabular-nums;
}
.opts{display:grid; gap:14px; margin-top:24px}
.opts label{font-size:.9rem; color:var(--muted); display:block; margin-bottom:6px}
.seg{display:inline-flex; flex-wrap:wrap; gap:4px; background:color-mix(in srgb, var(--bg) 60%, transparent); padding:4px; border-radius:12px}
.seg button{border:0; background:transparent; padding:7px 12px; border-radius:9px; font-size:.92rem; color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface); color:var(--text); box-shadow:0 1px 0 var(--line), 0 0 0 1px var(--line)}
.seg button:disabled{opacity:.35; cursor:not-allowed}
.actions{display:flex; gap:10px; margin-top:26px; flex-wrap:wrap}
.primary{background:var(--text); color:var(--bg); border:0; border-radius:14px; padding:12px 20px; font-weight:600}
.primary:hover{opacity:.9}

.result{padding:18px 0; border-bottom:1px solid var(--line)}
.result:last-of-type{border-bottom:0}
.result .cur{display:flex; justify-content:space-between; color:var(--muted); font-size:.92rem}
.result .val{font-family:var(--display); font-weight:600; font-size:clamp(1.9rem,4.5vw,2.8rem); letter-spacing:-.03em; font-variant-numeric:tabular-nums; line-height:1.15; overflow-wrap:anywhere}
.result .val.flash{animation:flash .6s ease}
@keyframes flash{from{color:var(--sol)}to{color:var(--text)}}
.cross{margin-top:14px; font-size:.9rem; color:var(--muted)}

/* ---------- Cotizaciones ---------- */
h2{font-family:var(--display); font-weight:600; font-size:1.35rem; letter-spacing:-.01em; margin:48px 0 14px}
.rates{display:grid; grid-template-columns:repeat(auto-fill,minmax(170px,1fr)); gap:1px; background:var(--line); border:1px solid var(--line); border-radius:20px; overflow:hidden}
.rate{background:var(--surface); padding:16px 18px}
.rate b{display:block; font-weight:600}
.rate .nums{display:flex; justify-content:space-between; margin-top:8px; font-variant-numeric:tabular-nums; font-size:.95rem}
.rate .nums span{color:var(--muted); font-size:.8rem; display:block}
.rate.uy{background:color-mix(in srgb, var(--sol) 9%, var(--surface))}
.note{color:var(--muted); font-size:.85rem; margin-top:10px}

/* ---------- Historial ---------- */
.hist-head{display:flex; justify-content:space-between; align-items:baseline; gap:12px}
.hist{list-style:none; padding:0; margin:0; display:grid; gap:8px}
.hist li{display:grid; grid-template-columns:1fr auto; gap:6px 16px; align-items:center; padding:14px 18px; border:1px solid var(--line); border-radius:16px; background:var(--surface)}
.hist .main{font-weight:600; font-variant-numeric:tabular-nums; overflow-wrap:anywhere}
.hist .meta{grid-column:1; color:var(--muted); font-size:.85rem}
.hist .btns{grid-row:1 / span 2; grid-column:2; display:flex; gap:6px}
.hist .btns button{border:1px solid var(--line); background:transparent; border-radius:10px; padding:6px 10px; font-size:.85rem}
.hist .btns button:hover{border-color:var(--plata-dim)}
.empty{border:1px dashed var(--line); border-radius:16px; padding:22px; color:var(--muted); text-align:center}
.toast{position:fixed; left:50%; bottom:calc(24px + env(safe-area-inset-bottom,0px)); transform:translate(-50%,20px); opacity:0; background:var(--text); color:var(--bg); padding:10px 18px; border-radius:12px; font-weight:500; transition:.25s; pointer-events:none}
.toast.show{opacity:1; transform:translate(-50%,0)}
footer{margin-top:48px; color:var(--muted); font-size:.82rem}
footer a{color:inherit}

@media (max-width:760px){
  .converter{grid-template-columns:1fr}
  .side-in{border-right:0; border-bottom:1px solid var(--line)}
  .side-in,.side-out{padding:24px 20px}
  .hist li{grid-template-columns:1fr}
  .hist .btns{grid-row:auto; grid-column:1}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important; transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand">
      <h1>Cambio Plata</h1>
      <span>pesos argentinos, uruguayos y dólares</span>
    </div>
    <div class="live" aria-live="polite">
      <span class="dot load" id="dot"></span>
      <span id="status">Buscando cotizaciones…</span>
      <button class="ghost" id="refresh" title="Actualizar ahora">Actualizar</button>
      <button class="ghost" id="theme" title="Cambiar tema">Tema</button>
    </div>
  </header>

  <section class="converter" aria-label="Conversor">
    <div class="side-in">
      <p class="q">Tengo</p>
      <div class="chips" id="fromChips">
        <button class="chip" data-cur="ARS" aria-pressed="true">ARS <small>peso argentino</small></button>
        <button class="chip" data-cur="UYU" aria-pressed="false">UYU <small>peso uruguayo</small></button>
        <button class="chip" data-cur="USD" aria-pressed="false">USD <small>dólar</small></button>
      </div>
      <div class="amount">
        <span class="sym" id="sym">$</span>
        <input id="amount" inputmode="decimal" autocomplete="off" value="100.000" aria-label="Monto">
      </div>

      <div class="opts">
        <div>
          <label>Dólar argentino a usar</label>
          <div class="seg" id="casaSeg"></div>
        </div>
        <div>
          <label>Precio</label>
          <div class="seg" id="sideSeg">
            <button data-side="venta" aria-pressed="true">Venta (comprás dólares)</button>
            <button data-side="compra" aria-pressed="false">Compra (vendés dólares)</button>
          </div>
        </div>
      </div>

      <div class="actions">
        <button class="primary" id="save">Guardar consulta</button>
        <button class="ghost" id="swap">Invertir</button>
      </div>
    </div>

    <div class="side-out" aria-live="polite">
      <p class="q">Equivale a</p>
      <div id="results"></div>
      <p class="cross" id="cross"></p>
    </div>
  </section>

  <h2>Cotizaciones del momento</h2>
  <div class="rates" id="rates"></div>
  <p class="note" id="srcNote"></p>

  <div class="hist-head">
    <h2>Mis consultas guardadas</h2>
    <button class="ghost" id="clearAll" hidden>Borrar todo</button>
  </div>
  <ul class="hist" id="hist"></ul>

  <footer>
    Datos: <a href="https://dolarapi.com" target="_blank" rel="noopener">DolarAPI</a> (Argentina y Uruguay) con respaldo de
    <a href="https://www.exchangerate-api.com" target="_blank" rel="noopener">ExchangeRate-API</a>.
    Valores de referencia; casas de cambio y bancos pueden cotizar distinto.
  </footer>
</div>
<div class="toast" id="toast" role="status"></div>

<script>
(() => {
  const REFRESH_SECONDS = 60;
  const KEY_HIST = "cambioPlata.historial";
  const KEY_RATES = "cambioPlata.cotizaciones";
  const KEY_PREFS = "cambioPlata.preferencias";

  const CASAS = [
    ["oficial","Oficial"],["blue","Blue"],["bolsa","MEP"],
    ["contadoconliqui","CCL"],["tarjeta","Tarjeta"],["cripto","Cripto"],["mayorista","Mayorista"]
  ];
  const CUR = {
    ARS:{sym:"$",  name:"Pesos argentinos"},
    UYU:{sym:"$U", name:"Pesos uruguayos"},
    USD:{sym:"US$",name:"Dólares"}
  };

  const S = {
    from:"ARS", amount:100000, casa:"blue", side:"venta",
    ars:{}, uyu:null, updated:null, source:"", countdown:REFRESH_SECONDS, loading:false
  };

  const $ = id => document.getElementById(id);
  const store = {
    get(k, d){ try{ const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; }catch{ return d; } },
    set(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch{} }
  };

  /* ---------- Formato ---------- */
  const fmt = (n, cur) => {
    if (n == null || !isFinite(n)) return "—";
    const abs = Math.abs(n);
    const dec = abs !== 0 && abs < 1 ? 4 : 2;
    return new Intl.NumberFormat("es-AR",{minimumFractionDigits:dec, maximumFractionDigits:dec}).format(n);
  };
  const parseAmount = str => {
    let s = String(str).trim().replace(/\s/g,"");
    if (!s) return 0;
    if (s.includes(",")) s = s.replace(/\./g,"").replace(",",".");
    else if (/^\d{1,3}(\.\d{3})+$/.test(s)) s = s.replace(/\./g,"");
    const n = parseFloat(s);
    return isFinite(n) ? n : 0;
  };
  const time = d => new Date(d).toLocaleString("es-AR",{day:"2-digit",month:"2-digit",hour:"2-digit",minute:"2-digit"});

  /* ---------- Tasas ---------- */
  const pick = (o, side) => o ? (o[side] ?? o.venta ?? o.compra ?? null) : null;
  const arsPerUsd = () => pick(S.ars[S.casa], S.side);
  const uyuPerUsd = () => pick(S.uyu, S.side);
  const rateOf = cur => cur === "USD" ? 1 : cur === "ARS" ? arsPerUsd() : uyuPerUsd();
  const convert = (amount, from, to) => {
    const rf = rateOf(from), rt = rateOf(to);
    if (!rf || !rt) return null;
    return amount / rf * rt;
  };

  async function getJSON(url){
    const ctrl = new AbortController();
    const t = setTimeout(() => ctrl.abort(), 9000);
    try{
      const r = await fetch(url,{signal:ctrl.signal, cache:"no-store"});
      if (!r.ok) throw new Error(r.status);
      return await r.json();
    } finally { clearTimeout(t); }
  }

  async function loadRates(){
    if (S.loading) return;
    S.loading = true;
    setStatus("load","Actualizando…");

    const [ar, uy, fx] = await Promise.allSettled([
      getJSON("https://dolarapi.com/v1/dolares"),
      getJSON("https://uy.dolarapi.com/v1/cotizaciones"),
      getJSON("https://open.er-api.com/v6/latest/USD")
    ]);

    const ars = {}; let uyu = null; const src = [];
    if (ar.status === "fulfilled" && Array.isArray(ar.value)){
      ar.value.forEach(c => { if (c.casa) ars[c.casa] = {compra:c.compra, venta:c.venta, fecha:c.fechaActualizacion}; });
      src.push("DolarAPI Argentina");
    }
    if (uy.status === "fulfilled" && Array.isArray(uy.value)){
      const usd = uy.value.find(c => (c.moneda||"").toUpperCase() === "USD");
      if (usd) { uyu = {compra:usd.compra, venta:usd.venta, fecha:usd.fechaActualizacion}; src.push("DolarAPI Uruguay"); }
    }
    if (fx.status === "fulfilled" && fx.value && fx.value.rates){
      const r = fx.value.rates;
      if (!ars.oficial && r.ARS) { ars.oficial = {compra:r.ARS, venta:r.ARS, ref:true}; src.push("ExchangeRate-API (ARS)"); }
      if (!uyu && r.UYU) { uyu = {compra:r.UYU, venta:r.UYU, ref:true}; src.push("ExchangeRate-API (UYU)"); }
    }

    S.loading = false;
    S.countdown = REFRESH_SECONDS;

    if (Object.keys(ars).length && uyu){
      S.ars = ars; S.uyu = uyu; S.updated = Date.now(); S.source = src.join(" + ");
      store.set(KEY_RATES,{ars, uyu, updated:S.updated, source:S.source});
      if (!S.ars[S.casa]) S.casa = S.ars.blue ? "blue" : "oficial";
      setStatus("ok", `En vivo · ${time(S.updated)}`);
      renderAll(true);
    } else {
      const cached = store.get(KEY_RATES,null);
      if (cached && !S.updated){
        Object.assign(S,{ars:cached.ars, uyu:cached.uyu, updated:cached.updated, source:cached.source});
        renderAll();
      }
      setStatus("err", S.updated ? `Sin conexión · usando datos del ${time(S.updated)}` : "No se pudieron cargar las cotizaciones");
    }
  }

  /* ---------- Render ---------- */
  function setStatus(kind, text){
    $("dot").className = "dot" + (kind === "err" ? " err" : kind === "load" ? " load" : "");
    $("status").textContent = text;
  }

  function renderCasas(){
    $("casaSeg").innerHTML = CASAS.map(([k,l]) =>
      `<button data-casa="${k}" aria-pressed="${S.casa===k}" ${S.ars[k] ? "" : "disabled"}>${l}</button>`).join("");
  }

  function renderResults(flash){
    const targets = ["ARS","UYU","USD"].filter(c => c !== S.from);
    $("results").innerHTML = targets.map(c => {
      const v = convert(S.amount, S.from, c);
      return `<div class="result">
        <div class="cur"><span>${CUR[c].name}</span><span>${c}</span></div>
        <div class="val${flash ? " flash":""}">${CUR[c].sym} ${fmt(v)}</div>
      </div>`;
    }).join("");
    const a = arsPerUsd(), u = uyuPerUsd();
    const casaLabel = (CASAS.find(c => c[0]===S.casa)||[])[1] || "";
    $("cross").textContent = a && u
      ? `1 USD = $ ${fmt(a)} ARS (${casaLabel}) · 1 USD = $U ${fmt(u)} · 1 UYU = $ ${fmt(a/u)} ARS`
      : "";
  }

  function renderRates(){
    const cards = CASAS.filter(([k]) => S.ars[k]).map(([k,l]) => {
      const c = S.ars[k];
      return `<div class="rate"><b>Dólar ${l} <small style="color:var(--muted);font-weight:400">AR</small></b>
        <div class="nums"><div><span>Compra</span>${c.compra != null ? fmt(c.compra) : "—"}</div><div><span>Venta</span>${fmt(c.venta)}</div></div></div>`;
    });
    if (S.uyu) cards.unshift(`<div class="rate uy"><b>Dólar <small style="color:var(--muted);font-weight:400">UY</small></b>
      <div class="nums"><div><span>Compra</span>${fmt(S.uyu.compra)}</div><div><span>Venta</span>${fmt(S.uyu.venta)}</div></div></div>`);
    $("rates").innerHTML = cards.join("");
    $("srcNote").textContent = S.source ? `Fuente: ${S.source}. Se actualiza solo cada ${REFRESH_SECONDS} segundos.` : "";
  }

  function renderFrom(){
    document.querySelectorAll("#fromChips .chip").forEach(b => b.setAttribute("aria-pressed", b.dataset.cur === S.from));
    $("sym").textContent = CUR[S.from].sym;
    document.querySelectorAll("#sideSeg button").forEach(b => b.setAttribute("aria-pressed", b.dataset.side === S.side));
  }

  function renderAll(flash){ renderCasas(); renderFrom(); renderResults(flash); renderRates(); }

  /* ---------- Historial ---------- */
  const getHist = () => store.get(KEY_HIST, []);
  function renderHist(){
    const h = getHist();
    $("clearAll").hidden = !h.length;
    if (!h.length){
      $("hist").innerHTML = `<li class="empty" style="display:block">Todavía no guardaste consultas. Escribí un monto y tocá “Guardar consulta”.</li>`;
      return;
    }
    $("hist").innerHTML = h.map(q => {
      const outs = Object.entries(q.results).map(([c,v]) => `${CUR[c].sym} ${fmt(v)} ${c}`).join("  /  ");
      const casaLabel = (CASAS.find(c => c[0]===q.casa)||[])[1] || q.casa;
      return `<li>
        <div class="main">${CUR[q.from].sym} ${fmt(q.amount)} ${q.from} → ${outs}</div>
        <div class="meta">${time(q.at)} · Dólar ${casaLabel} ${q.side} · 1 USD = $ ${fmt(q.rates.ars)} ARS / $U ${fmt(q.rates.uyu)}</div>
        <div class="btns">
          <button data-load="${q.id}" title="Volver a calcular con cotización actual">Recalcular</button>
          <button data-del="${q.id}" aria-label="Borrar consulta">Borrar</button>
        </div>
      </li>`;
    }).join("");
  }

  function saveQuery(){
    if (!arsPerUsd() || !uyuPerUsd()){ toast("Esperá a que carguen las cotizaciones"); return; }
    if (!S.amount){ toast("Ingresá un monto mayor a cero"); return; }
    const results = {};
    ["ARS","UYU","USD"].filter(c => c !== S.from).forEach(c => results[c] = convert(S.amount, S.from, c));
    const h = getHist();
    h.unshift({ id: Date.now().toString(36), at: Date.now(), amount:S.amount, from:S.from,
      casa:S.casa, side:S.side, results, rates:{ars:arsPerUsd(), uyu:uyuPerUsd()} });
    store.set(KEY_HIST, h.slice(0,50));
    renderHist();
    toast("Consulta guardada");
  }

  let tt;
  function toast(msg){ const t=$("toast"); t.textContent = msg; t.classList.add("show"); clearTimeout(tt); tt = setTimeout(()=>t.classList.remove("show"),2000); }
  const savePrefs = () => store.set(KEY_PREFS,{from:S.from, casa:S.casa, side:S.side, amount:S.amount});

  /* ---------- Eventos ---------- */
  $("amount").addEventListener("input", e => { S.amount = parseAmount(e.target.value); renderResults(); savePrefs(); });
  $("amount").addEventListener("blur", e => { if (S.amount) e.target.value = fmt(S.amount).replace(/,00$/,""); });
  $("amount").addEventListener("keydown", e => { if (e.key === "Enter") saveQuery(); });

  $("fromChips").addEventListener("click", e => {
    const b = e.target.closest("[data-cur]"); if (!b) return;
    S.from = b.dataset.cur; renderFrom(); renderResults(); savePrefs(); $("amount").focus();
  });
  $("casaSeg").addEventListener("click", e => {
    const b = e.target.closest("[data-casa]"); if (!b || b.disabled) return;
    S.casa = b.dataset.casa; renderCasas(); renderResults(); savePrefs();
  });
  $("sideSeg").addEventListener("click", e => {
    const b = e.target.closest("[data-side]"); if (!b) return;
    S.side = b.dataset.side; renderFrom(); renderResults(); savePrefs();
  });
  $("swap").addEventListener("click", () => {
    const order = ["ARS","UYU","USD"];
    const next = order[(order.indexOf(S.from)+1) % 3];
    const v = convert(S.amount, S.from, next);
    if (v != null){ S.amount = Math.round(v*100)/100; $("amount").value = fmt(S.amount).replace(/,00$/,""); }
    S.from = next; renderFrom(); renderResults(true); savePrefs();
  });
  $("save").addEventListener("click", saveQuery);
  $("refresh").addEventListener("click", loadRates);
  $("hist").addEventListener("click", e => {
    const del = e.target.closest("[data-del]"), load = e.target.closest("[data-load]");
    if (del){ store.set(KEY_HIST, getHist().filter(q => q.id !== del.dataset.del)); renderHist(); toast("Consulta borrada"); }
    if (load){
      const q = getHist().find(x => x.id === load.dataset.load); if (!q) return;
      Object.assign(S,{from:q.from, amount:q.amount, casa:S.ars[q.casa] ? q.casa : S.casa, side:q.side});
      $("amount").value = fmt(q.amount).replace(/,00$/,"");
      renderAll(true); savePrefs(); window.scrollTo({top:0, behavior:"smooth"});
    }
  });
  $("clearAll").addEventListener("click", () => {
    if (confirm("¿Borrar todas las consultas guardadas?")){ store.set(KEY_HIST, []); renderHist(); toast("Historial borrado"); }
  });
  $("theme").addEventListener("click", () => {
    const root = document.documentElement;
    const isDark = root.dataset.theme ? root.dataset.theme === "dark" : !matchMedia("(prefers-color-scheme: light)").matches;
    root.dataset.theme = isDark ? "light" : "dark";
    store.set("cambioPlata.tema", root.dataset.theme);
  });

  /* ---------- Auto-actualización ---------- */
  setInterval(() => {
    if (document.hidden || S.loading) return;
    S.countdown--;
    if (S.countdown <= 0) loadRates();
    else if (S.updated && $("dot").className === "dot")
      $("status").textContent = `En vivo · ${time(S.updated)} · próxima en ${S.countdown}s`;
  }, 1000);
  document.addEventListener("visibilitychange", () => { if (!document.hidden && S.countdown < REFRESH_SECONDS/2) loadRates(); });
  window.addEventListener("online", loadRates);

  /* ---------- Inicio ---------- */
  const tema = store.get("cambioPlata.tema", null); if (tema) document.documentElement.dataset.theme = tema;
  const p = store.get(KEY_PREFS, null);
  if (p) Object.assign(S, p);
  $("amount").value = fmt(S.amount).replace(/,00$/,"");
  const cached = store.get(KEY_RATES, null);
  if (cached){ Object.assign(S,{ars:cached.ars, uyu:cached.uyu, updated:cached.updated, source:cached.source}); renderAll(); }
  else renderAll();
  renderHist();
  loadRates();
})();
</script>
</body>
</html>
